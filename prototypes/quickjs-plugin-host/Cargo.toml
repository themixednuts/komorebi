[package]
name = "quickjs-plugin-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
mlua = { version = "0.12.1", features = ["error-send", "luajit", "vendored"] }
oxc_allocator = "0.147"
oxc_codegen = "0.147"
oxc_diagnostics = "0.147"
oxc_parser = "0.147"
oxc_semantic = "0.147"
oxc_span = "0.147"
oxc_transformer = "0.147"
oxc_sourcemap = "8.1"
parking_lot = "0.12"
rquickjs = { version = "0.12.2", features = ["futures", "loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
