[package]
name = "komorebi-settings"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
drizzle = { version = "=0.1.16", features = ["rusqlite", "serde"] }
komorebi-shell = { path = "../komorebi-shell" }
komorebi-sqlite = { path = "../komorebi-sqlite" }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
thiserror = "2"

[build-dependencies]
drizzle = { version = "=0.1.16", features = ["rusqlite", "serde"] }
drizzle-migrations = "=0.1.16"
rusqlite = { version = "=0.39.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
