[package]
name = "komorebi-extensions"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
komorebi-protocol = { path = "../komorebi-protocol" }
mlua = { version = "=0.12.1", features = ["luajit", "vendored"] }
parking_lot = { workspace = true }
thiserror = "2"
tokio = { version = "=1.53.1", features = ["fs", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
dunce = { workspace = true }
notify = "=9.0.0-rc.5"
windows-core = { workspace = true }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_SystemServices",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "komorebi-extension-worker"
path = "src/bin/komorebi-extension-worker.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
