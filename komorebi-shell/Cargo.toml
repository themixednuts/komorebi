[package]
name = "komorebi-shell"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
komorebi-command-transport = { path = "../komorebi-command-transport" }
komorebi-layouts = { path = "../komorebi-layouts" }
komorebi-protocol = { path = "../komorebi-protocol" }
komorebi-search = { path = "../komorebi-search" }
neo_frizbee = "=0.11.0"
schemars = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = "2"
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "System",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serial_test = "3"
serde_json = { workspace = true }
tempfile = "3"

[features]
default = []
schemars = ["dep:schemars"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
