[package]
name = "exclusive-notification-presentation-prototype"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dependencies.windows]
version = "0.62"
features = [
  "ApplicationModel",
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "UI_Notifications_Management",
  "UI_Shell",
  "Win32_System_WinRT",
]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "warn"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"

[[bin]]
name = "notification-probe"
path = "src/main.rs"
