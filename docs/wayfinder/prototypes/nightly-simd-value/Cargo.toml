[workspace]
members = ["benchmark", "compatibility/*", "kernel", "runner"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
drizzle = { version = "=0.1.16", features = ["rusqlite"] }
# Cargo.lock pins the shared GPUI source to the renderer revision measured by issue #47.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "6d07863fe7077f85abfa0ec2fcb05f3e17c573b2" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "6d07863fe7077f85abfa0ec2fcb05f3e17c573b2" }
mlua = { version = "=0.12.0", features = ["error-send", "luajit", "vendored", "serialize"] }
proptest = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
debug = "line-tables-only"
