[package]
name = "wayfinder-protocol-recovery-prototype"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
anyhow = "1.0"
drizzle = { version = "=0.1.16", features = ["rusqlite", "serde"] }
minicbor = { version = "=2.3.0", features = ["std"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Wdk_System_SystemServices",
] }

[dev-dependencies]
proptest = "1.9"

[build-dependencies]
drizzle-migrations = "=0.1.16"
drizzle-types = "=0.1.16"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
