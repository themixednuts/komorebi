[package]
name = "komorebi-command-palette"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
komorebi-protocol = { path = "../komorebi-protocol" }
komorebi-shell = { path = "../komorebi-shell" }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
missing_errors_doc = "allow"
must_use_candidate = "allow"
